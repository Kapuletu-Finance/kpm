# Local, offline development database.
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://kpm:kpm@localhost:55432/kpm
#   (55432 avoids clashing with a natively installed Postgres; override with KPM_PG_PORT)
#
# No PgBouncer locally: the dev server is a single long-lived Node process,
# so lib/db/index.ts holds a small pool and reuses it across hot reloads.

name: kpm-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpm
      POSTGRES_PASSWORD: kpm
      POSTGRES_DB: kpm
    ports:
      - "127.0.0.1:${KPM_PG_PORT:-55432}:5432"
    volumes:
      - kpm_pg_dev:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - log_min_duration_statement=200 # surface slow queries while developing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpm -d kpm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kpm_pg_dev:
