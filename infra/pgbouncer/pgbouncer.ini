[databases]
; "postgres" resolves to the compose service on the private network.
kpm = host=postgres port=5432 dbname=kpm

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Transaction pooling: a server connection is held only for the length of a
; transaction, so hundreds of short-lived Vercel invocations share a few
; Postgres backends. Session state (SET, LISTEN, advisory locks, temp tables)
; does not survive between transactions. Use the direct connection for those.
pool_mode = transaction

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Client side: Vercel reaches us over the public internet, so require TLS.
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_key_file = /etc/pgbouncer/tls/server.key
client_tls_protocols = tlsv1.2,tlsv1.3

; Server side stays on the private Docker network.
server_tls_sslmode = disable

; Sizing: max_client_conn is cheap (client sockets); default_pool_size is the
; number of real Postgres backends per (db, user) pair. Keep
; default_pool_size + reserve_pool_size well under Postgres max_connections.
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3

; Lets prepared statements work in transaction mode (PgBouncer >= 1.21).
max_prepared_statements = 200

server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 30
client_idle_timeout = 0
idle_transaction_timeout = 60

; Drivers send these as startup params; ignore instead of rejecting.
ignore_startup_parameters = extra_float_digits,options,statement_timeout

admin_users = kpm
stats_users = kpm
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
